name: Tokmon
options:
  bundleIdPrefix: com.devsh
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  Tokmon:
    type: application
    platform: macOS
    sources:
      - Tokmon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devsh.Tokmon
        INFOPLIST_GENERATION_MODE: GeneratedFile
        PRODUCT_NAME: Tokmon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
    entitlements:
      path: Tokmon/Tokmon.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.files.user-selected.read-only: true
